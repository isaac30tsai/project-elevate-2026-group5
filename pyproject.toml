[project]
name = "tpe-elevate-group5-agent"
version = "1.0.0"
description = "Altostrat HR Agentic Solution (MVP 1) built on Google ADK 2.0 and FastMCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.5.0",
    "google-genai>=1.0.0",
    "google-cloud-discoveryengine>=0.13.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-kms>=2.21.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
