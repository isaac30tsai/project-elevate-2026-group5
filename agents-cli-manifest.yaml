schema_version: "v1"
agent:
  name: "tpe-elevate-group5-agent"
  version: "1.0.0"
  description: "Altostrat HR Agentic Solution (MVP 1)"
  entrypoint: "app.main:app"
  model: "gemini-3.7-flash"
  gcp_project: "junho-elevate"
  region: "global"

evaluation:
  eval_config: "eval/eval_config.yaml"
  datasets_dir: "eval/datasets"
  report_output: "eval/evaluation_report.md"
  rubrics:
    grounding:
      min_threshold: 0.95
    tool_trajectory:
      min_threshold: 0.99
    safety_filter:
      min_threshold: 0.98
