trade_offs:
  defer_redundant_rag_probes: true
  justification: Focusing budget on critical transaction boundaries and safety guardrails,
    saving ~30% token overhead.
  defer_deep_multi_turn_stress: true
  multi_turn_justification: 10-turn enterprise journey (EVAL-017) and 6-step cross-system
    scenario (ww_si) provide comprehensive multi-turn state validation without incurring
    recursive LLM stress testing costs.
