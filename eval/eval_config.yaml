version: '3.2'
eval_name: altostrat-hr-agent-4tier-rubric-benchmark
target_agent: app.agent:HRAgentOrchestrator
datasets:
- tests/eval/datasets/eval-data.json
- tests/eval/datasets/eval-data2.json
- tests/eval/datasets/evalset.json
organization_assumptions:
  company_name: Altostrat Singapore Pte Ltd
  headcount: 500
  time_zone: Asia/Singapore (SGT)
  operating_hours: 09:00 - 18:00 SGT (Monday - Friday)
  regulatory_frameworks:
  - name: Singapore Ministry of Manpower (MOM) Employment Act (Cap. 91)
    scope: "Mandates paid outpatient sick leave (\xA712.1), paid hospitalization leave\
      \ (\xA712.1), and compassionate bereavement (\xA714.2)"
  - name: Singapore Personal Data Protection Act (PDPA 2012)
    scope: Zero-tolerance (0.0%) residual plaintext leakage for NRIC/FIN, contact
      phone, and financial identifiers
  - name: "Altostrat Singapore Employee Policy Handbook (\xA76\u2013\xA735)"
    scope: "Excludes summary sections \xA71\u2013\xA75 from grounding; mandates authoritative\
      \ section citations (\xA7)"
scoring_formulas:
  overall_run_score:
    formula: score = 0.3 * context_hit_rate(retrieved_chunks, gold_chunks) + 0.3 *
      groundedness + 0.2 * semantic_similarity + 0.2 * citation_accuracy
    metrics:
    - name: context_hit_rate
      aliases:
      - context_hit_rate_at_k
      k: 3
      target_threshold: 0.9
      weight: 0.3
      description: Direct retrieval Context Hit Rate @ K evaluating semantic search
        precision before response generation
    - name: mrr
      target_threshold: 0.9
      weight: 0.1
      description: Mean Reciprocal Rank (MRR @ K=3) measuring semantic search precision
        and ranking position
    - name: ragas_groundedness
      target_threshold: 0.85
      weight: 0.3
      description: Factual adherence of generated claims against retrieved handbook
        context
    - name: semantic_similarity
      aliases:
      - semantic_cosine_similarity
      target_threshold: 0.8
      weight: 0.2
      description: Semantic cosine similarity with authoritative ground truth claims
    - name: citation_accuracy
      target_threshold: 0.9
      weight: 0.2
      description: "Presence and validity of mandatory handbook section citations\
        \ (\xA7)"
    weights:
      context_hit_rate: 0.3
      ragas_groundedness: 0.3
      semantic_similarity: 0.2
      citation_accuracy: 0.2
      mrr: 0.1
    reliability_threshold: 0.9
factuality_verification:
  strategy: Multi-LLM Debate Consensus & G-Eval Alignment (HallucinationValidator)
  primary_judge: gemini-3.5-flash
  consensus_auditor: gemini-3.7-flash
  human_in_the_loop_sampling_rate: 0.1
  hallucination_penalty_multiplier: 1.0
  judge_metrics:
    agreement_cohens_kappa_target: '>= 0.70'
    judge_false_positive_rate: < 0.01
    judge_false_negative_rate: < 0.01
    agreement_cohens_kappa_measured: 0.88
brd_functional_coverage_matrix:
