    verification_target: "Validates strict business priority assignment rules under BRD Section 2.3, verifying that the system blocks attempts to escalate minor issues to high severity and automatically downgrades routine inquiries to Low."
    trajectory_feedback: "Confirm that the generated support incident ticket enforces a Priority 4 (Low) severity and informs the employee of the auto-adjustment policy."

